<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <style>


body {
    margin: 0;
    font-family: Arial, sans-serif;
}




nav {
    height: 70px;

    background-color: black;
    color: white;

    padding: 0 40px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav h2 {
    margin: 0;
}

.nav-links {
    display: flex;
    gap: 30px;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-size: 17px;
}




.hero {
    height: 700px;

    background-image: url("/ADVCSSTESTHW/image2.jpg");
    background-size: cover;
    background-position: center;

    position: relative;
}




.hero-content {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 60%;

    text-align: center;
    color: white;
}

.hero-content h1 {
    font-size: 55px;
    margin-bottom: 20px;
}

.hero-content p {
    font-size: 20px;
    line-height: 1.6;
}



.hero-content button {
    position: relative;

    padding: 15px 30px;

    background-color: #ff6b35;
    color: white;

    border: none;
    border-radius: 5px;

    font-size: 18px;
    cursor: pointer;
}



@media (max-width: 768px) {

    nav {
        flex-direction: column;
        height: auto;
        padding: 20px;
        gap: 15px;
    }

    .nav-links {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .hero {
        height: 600px;

        background-image: url("/ADVCSSTESTHW/image1.jpg");
        background-position: center;
    }

    .hero-content {
        width: 85%;
    }

    .hero-content h1 {
        font-size: 35px;
    }

    .hero-content p {
        font-size: 16px;
    }

    .hero-content button {
        position: relative;
        padding: 12px 25px;
    }
}
        </style>
    </head>
    <body>
            <nav>
        <h2>TravelWorld</h2>

        <div class="nav-links">
            <a href="">Home</a>
            <a href="">Destinations</a>
            <a href="">About</a>
            <a href="">Contact</a>
        </div>
    </nav>


   
    <section class="hero">

        <div class="hero-content">
            <h1>Explore The World</h1>

            <p>
                Discover beautiful destinations, experience
                new cultures and create unforgettable memories.
            </p>

            <button>Explore Now</button>
        </div>

    </section>

        
    </body>
</html>
