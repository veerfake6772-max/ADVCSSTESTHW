<!DOCTYPE html>

<html>

<head>

    <style>
        nav {
            display: flex;
            align-items: center;
            padding: 20px;

            display: flex;
            gap: 20px;

        .cards{

        .card{

            margin: 10px;
            padding: 10px;
            border-radius: 10px;
            height: 50px;
            width: 200px;
        }
        @media (max-width: 500px){
            .cards{
                flex-wrap: wrap;
            }
        }
    </style>
</head>

            <a href="">Home</a>

        </div>
    </nav>
    <div class="cards">
        <div class="card">Card 1
            <p>Content Card 1</p>
        </div>
        <div class="card">Card 2
            <p>Content card 2</p>
        </div>
        <div class="card">Card 3
            <p>Content card 3</p>
        </div>
        <div class="card">Card 4

        </div>
    </div>

</html>
