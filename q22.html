<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]>      <html class="no-js"> <!--<![endif]-->
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }




        .login-page {
            min-height: 600px;

            background-image: url("/ADVCSSTESTHW/image1.jpg");
            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }




        .login-page::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-color: rgba(0, 0, 0, 0.5);
        }



        .login-box {
            width: 400px;

            padding: 40px;

            background-color: white;

            border: 2px solid;
            border-radius: 15px;

            position: relative;

            text-align: center;

            box-shadow: 0 5px 20px black;
        }



        .login-box h1 {
            margin: 0;

            font-family: Georgia, serif;
            font-size: 35px;

            color: black;


        }




        .subtitle {
            margin-bottom: 30px;

            color: grey;

            font-size: 16px;
        }




        form {
            display: flex;
            flex-direction: column;
            text-align: left;
        }




        form label {
            margin-bottom: 8px;

            font-size: 16px;
            font-weight: bold;

            color: black;
        }




        form input {
            width: 100%;

            padding: 14px;

            margin-bottom: 20px;

            border: 2px solid;
            border-radius: 6px;

            font-size: 16px;


        }







        button {
            width: 100%;

            padding: 14px;

            background-color: rgb(19, 155, 246);
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background-color: skyblue;
        }


        .signup {
            margin-top: 25px;

            font-size: 14px;

            color: grey;
        }

        .signup a {
            color: skyblue;
            text-decoration: none;
            font-weight: bold;
        }




        @media (max-width: 600px) {

            .login-page {
                padding: 20px;

                background-image:url(/ADVCSSTESTHW/image2.jpg);
            }

            .login-box {
                width: 100%;

                padding: 30px 20px;

                border-radius: 10px;
            }

            .login-box h1 {
                font-size: 28px;
            }

        }
    </style>
</head>

<body>
    <div class="login-page">

        <div class="login-box">

            <h1>Welcome Back</h1>

            <p class="subtitle">Login to your account</p>

            <form>

                <label>Email</label>
                <input type="email" placeholder="Enter your email">

                <label>Password</label>
                <input type="password" placeholder="Enter your password">

                <button type="submit">Login</button>

            </form>

            <p class="signup">
                Don't have an account?
                <a href="">Sign Up</a>
            </p>

        </div>

    </div>


</body>

</html>
